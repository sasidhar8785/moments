name: iOS app

on:
  push:
    branches: [main]
    paths: ["ios/**", "web/ar/creators/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # Compile for real devices without signing: catches every build error. Signing happens
      # on your Mac in Xcode with your own Apple ID.
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Moments.xcodeproj -scheme Moments -configuration Debug \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build \
            | xcbeautify --renderer github-actions

      # Commit the generated project so it can be opened on a Mac without installing XcodeGen.
      - name: Commit the generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ios/Moments.xcodeproj ios/Moments/Info.plist
          if git diff --cached --quiet; then
            echo "Project unchanged"
          else
            git commit -m "Regenerate Xcode project"
            git push
          fi
