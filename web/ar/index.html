<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moments AR</title>
<style>
  :root {
    --bg: #faf7f2; --fg: #1d1b19; --muted: #6b655e; --card: #ffffff;
    --accent: #e8590c; --accent-fg: #ffffff; --line: #e7e0d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161412; --fg: #f3efe9; --muted: #a59d93; --card: #211e1b;
            --accent: #ff7a2e; --accent-fg: #160c05; --line: #34302b; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input, select { width: 100%; font: inherit; padding: 12px; border-radius: 10px;
                  border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button { display: block; width: 100%; font: inherit; font-weight: 700; padding: 16px; margin-top: 12px;
           border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  button.secondary { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: .5; }
  [hidden] { display: none !important; }

  /* Full-screen experience (camera mode and WebXR overlay share these controls). */
  #stage { position: fixed; inset: 0; background: #000; overflow: hidden; touch-action: none; }
  #cam, #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
  #cam { object-fit: cover; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; font: 15px/1.4 system-ui, sans-serif; }
  #hint { position: absolute; left: 16px; right: 16px; top: calc(14px + env(safe-area-inset-top));
          text-align: center; background: rgba(0,0,0,.5); padding: 10px 14px; border-radius: 12px; }
  #controls { position: absolute; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom));
              display: flex; align-items: center; justify-content: center; gap: 28px; }
  #controls button { pointer-events: auto; width: auto; margin: 0; }
  .round { width: 52px !important; height: 52px; border-radius: 50%; padding: 0; background: rgba(0,0,0,.55);
           color: #fff; font-size: 13px; }
  #rec { width: 76px !important; height: 76px; border-radius: 50%; padding: 0; background: transparent;
         border: 5px solid #fff; display: grid; place-items: center; }
  #rec span { display: block; width: 54px; height: 54px; border-radius: 50%; background: #ff3b30; transition: all .2s; }
  #rec.on span { width: 28px; height: 28px; border-radius: 6px; }
  #timer { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(112px + env(safe-area-inset-bottom));
           background: #ff3b30; padding: 2px 10px; border-radius: 8px; font-weight: 700; }

  #result { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: grid; place-items: center; padding: 16px; }
  #result .box { width: 100%; max-width: 420px; }
  #result video { width: 100%; max-height: 64vh; border-radius: 14px; background: #000; display: block; }
</style>
</head>
<body>
<main id="setup">
  <h1 id="title">A moment, in your room</h1>
  <p class="muted" id="sub">Loading…</p>

  <label for="name">Your first name</label>
  <input id="name" autocomplete="given-name" placeholder="e.g. Priya">

  <label for="occasion">Occasion</label>
  <select id="occasion"></select>

  <button id="start" disabled>Open camera</button>
  <button id="startXR" class="secondary" hidden>Live AR on the floor (Android)</button>
  <p id="note" class="muted" style="margin-top:12px"></p>
</main>

<div id="stage" hidden>
  <video id="cam" playsinline muted></video>
  <canvas id="gl"></canvas>
</div>

<div id="hud" hidden>
  <div id="hint">Drag to move them · move your phone to look around</div>
  <div id="timer" hidden>REC</div>
  <div id="controls">
    <button id="replay" class="round" aria-label="Replay">↻</button>
    <button id="rec" aria-label="Record"><span></span></button>
    <button id="close" class="round" aria-label="Close">✕</button>
  </div>
</div>

<div id="result" hidden>
  <div class="box">
    <video id="clip" playsinline controls></video>
    <button id="share">Save / share video</button>
    <button id="again" class="secondary">Record again</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
