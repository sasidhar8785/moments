<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order received</title>
<style>
  :root { --bg: #faf7f2; --fg: #1d1b19; --muted: #6b655e; --accent: #e8590c; --accent-fg: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161412; --fg: #f3efe9; --muted: #a59d93; --accent: #ff7a2e; --accent-fg: #160c05; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 28px; margin: 0 0 12px; }
  p { color: var(--muted); }
  a.btn { display: block; text-align: center; background: var(--accent); color: var(--accent-fg);
          text-decoration: none; font-weight: 700; padding: 16px; border-radius: 12px; margin: 24px 0; }
</style>
</head>
<body>
<main>
  <h1>Thank you! One last step 🎉</h1>
  <p>Film your room for about 5 seconds: phone upright, held still, with some floor in view where they should stand.</p>
  <!-- Pilot: a Google Form or Tally form with a file-upload field and the order email. -->
  <a class="btn" href="https://forms.gle/REPLACE_ME">Upload my room video</a>
  <p>We'll email your moment within 24 hours. Questions? <a href="mailto:hello@example.com">hello@example.com</a></p>
</main>
</body>
</html>
